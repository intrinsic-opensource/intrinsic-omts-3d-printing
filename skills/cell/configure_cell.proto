syntax = "proto3";

package omts.cell;

import "intrinsic/math/proto/point.proto";
import "intrinsic/math/proto/pose.proto";

// A's frames: where the cycle sets the part down on the ground behind the robot
// when the cell has no machine. `place_frame` holds the part at its resting
// height, `pre_place_frame` is 8 cm back along the approach, and
// `approach_frame` 10 cm above that. The tool is pitched like the grasp, leaning
// away from the robot, so the part is set down flat. They are created under
// `parent_object` if they do not exist, or moved.
message DropOff {
  // The tool's pitch from vertical, in degrees in [0, 90): the grasp's
  // `approach_tilt_degrees`.
  double approach_tilt_degrees = 1;
  // A's distance from the robot base, in metres, and its bearing, in degrees.
  double radius_m = 2;
  double bearing_degrees = 3;
  // Half the part's height: its centre's height when it rests on the ground.
  double part_half_height_m = 4;
  // How far past its centre the part is gripped, in metres; default 0.
  optional double grasp_depth_m = 5;

  // The frames' names; the defaults are the reBot cell's.
  optional string place_frame = 6;  // default "place_vise"
  optional string pre_place_frame = 7;  // default "pre_place_vise"
  optional string approach_frame = 8;  // default "machine_approach"
}

// Changes the cell in the live world: the printer and the wrist camera (with the
// `view` frame, so the camera still sees the printer as before), and A's
// frames. Every group is optional; one that is left out stays as it is.
message ConfigureCellParams {
  // Sets the printer's x in `parent_object` (the printer model's origin along
  // x from the robot's base, in metres); its y, z and orientation are kept.
  optional double printer_distance_m = 1;

  // Sets the camera's position in the flange frame, in metres; its orientation
  // is kept.
  optional intrinsic_proto.Point camera_offset_m = 2;

  // Whether to move the view frame so the camera keeps its place relative to
  // the printer, whatever the mount (the camera moves with the printer by the
  // same distance, and the arm's pose is solved for the new mount). Default
  // true. Off leaves the view where it is.
  optional bool follow_view = 3;

  // The world objects and frames involved; the defaults are the reBot cell's.
  optional string parent_object = 4;  // default "root"
  optional string printer_object = 5;  // default "printer"
  optional string camera_object = 6;  // default "orbbec_camera"
  optional string robot_object = 7;  // default "rebot"
  optional string flange_frame = 8;  // default "flange"
  optional string tool_object = 9;  // default "gripper"
  optional string tool_frame = 10;  // default "tool_frame"
  optional string view_frame = 11;  // default "view", a frame under the parent

  // Sets A's frames, for a part of a given height.
  optional DropOff drop_off = 12;
}

message ConfigureCellResult {
  // The poses after the change, in `parent_object`. The view is unset if it was
  // not moved.
  intrinsic_proto.Pose parent_t_printer = 1;
  intrinsic_proto.Pose parent_t_camera = 2;
  intrinsic_proto.Pose parent_t_view = 3;
  // A's frames after the change, in `parent_object`; unset if not set.
  intrinsic_proto.Pose parent_t_place = 4;
  intrinsic_proto.Pose parent_t_pre_place = 5;
  intrinsic_proto.Pose parent_t_approach = 6;
}
