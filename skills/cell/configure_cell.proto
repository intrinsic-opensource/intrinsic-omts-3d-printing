syntax = "proto3";

package omts.cell;

import "intrinsic/math/proto/point.proto";
import "intrinsic/math/proto/pose.proto";

// Moves the printer and the wrist camera in the live world, and the `view`
// frame with them so the camera still sees the printer as before. Every group
// is optional; one that is left out stays as it is.
message ConfigureCellParams {
  // Sets the printer's x in `parent_object` (the printer model's origin along
  // x from the robot's base, in metres); its y, z and orientation are kept.
  optional double printer_distance_m = 1;

  // Sets the camera's position in the flange frame, in metres; its orientation
  // is kept.
  optional intrinsic_proto.Point camera_offset_m = 2;

  // Whether to move the view frame so the camera keeps its place relative to
  // the printer, whatever the mount (the camera moves with the printer by the
  // same distance, and the arm's pose is solved for the new mount). Default
  // true. Off leaves the view where it is.
  optional bool follow_view = 3;

  // The world objects and frames involved; the defaults are the reBot cell's.
  optional string parent_object = 4;  // default "root"
  optional string printer_object = 5;  // default "printer"
  optional string camera_object = 6;  // default "orbbec_camera"
  optional string robot_object = 7;  // default "rebot"
  optional string flange_frame = 8;  // default "flange"
  optional string tool_object = 9;  // default "gripper"
  optional string tool_frame = 10;  // default "tool_frame"
  optional string view_frame = 11;  // default "view", a frame under the parent
}

message ConfigureCellResult {
  // The poses after the change, in `parent_object`. The view is unset if it was
  // not moved.
  intrinsic_proto.Pose parent_t_printer = 1;
  intrinsic_proto.Pose parent_t_camera = 2;
  intrinsic_proto.Pose parent_t_view = 3;
}
