syntax = "proto3";

package omts.grasp;

import "intrinsic/math/proto/pose.proto";

message PlanCuboidGraspParams {
  // The estimated pose of the part in the camera's sensor frame: the
  // `root_t_target` of `estimate_pose_multi_view`, which is named for the root
  // but is in the camera's frame.
  intrinsic_proto.Pose camera_t_target = 1;

  // The world object that holds the camera; its `sensor` frame is the one the
  // estimate is in (the object itself if it has none).
  string camera_name = 2;

  // The world object that owns the output frames, and the frame the grasp is
  // computed in (for example `root`).
  string parent_object = 3;

  // Names of the grasp and pre-grasp frames. They are created under
  // `parent_object`, or moved if they exist.
  string pregrasp_frame_name = 4;
  string grasp_frame_name = 5;

  // The tool's world object and frame. Its current orientation picks, of the
  // top-down grasps, the one the wrist turns least for.
  string tool_object_name = 6;
  string tool_frame_name = 7;

  // If set, the world object (an id or a name) that is moved to the part's pose.
  string target_scene_object_id = 8;

  // Distance of the pre-grasp back along the approach, in metres.
  double approach_offset_z = 9;

  // The part's centre must be at least this high in `parent_object`.
  double min_safe_z = 10;

  // Whether to publish the grasp and pre-grasp frames; default true. Off when
  // another grasp planner owns them: the part's pose is still updated and
  // `min_safe_z` still checked.
  optional bool publish_grasp_frames = 11;

  // Pitch of the grasp from vertical in degrees, in [0, 90), leaning away from
  // the origin of `parent_object`; default 0.
  optional double approach_tilt_degrees = 12;

  // How far the part can turn about the vertical and look the same: 180 (a
  // box, the default) or 90 (a square footprint).
  optional double yaw_symmetry_degrees = 13;
}

message PlanCuboidGraspResult {
  // The part's pose in `parent_object`.
  intrinsic_proto.Pose parent_t_target = 1;
  // The frames, in `parent_object`; unset when they were not published.
  intrinsic_proto.Pose parent_t_grasp = 2;
  intrinsic_proto.Pose parent_t_pregrasp = 3;
}
