syntax = "proto3";

package omts.printer;

import "services/prusalink/prusalink.proto";

message ReadPrinterStatusParams {
  optional int64 expected_job_id = 1;
  optional double rpc_timeout_seconds = 2;
}

message WaitForPrinterReadyParams {
  // Required by validation: never accept a different print job.
  optional int64 expected_job_id = 1;
  optional double timeout_seconds = 2;
  optional double poll_interval_seconds = 3;
  optional double rpc_timeout_seconds = 4;
}

message PrinterReadiness {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    WAITING_FOR_PRINT = 1;
    WAITING_FOR_COOLING = 2;
    TEMPERATURE_UNAVAILABLE = 3;
    PRINTER_BLOCKED = 4;
    JOB_MISMATCH = 5;
    JOB_UNKNOWN = 6;
    READY_TO_UNLOAD = 7;
  }
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    SNAPSHOT = 1;
    READY = 2;
    TIMED_OUT = 3;
  }
  omts.prusalink.PrinterStatus printer_status = 1;
  Decision decision = 2;
  Outcome outcome = 3;
  // Advisory only; this skill never commands a robot or authorizes motion.
  bool ready_for_unload = 4;
}
