syntax = "proto3";

package omts.printer;

import "services/prusalink/prusalink.proto";

message ReadJobModelParams {
  // Absent: whatever job the printer service saw last. Given: that job's
  // model, even if a newer job has started since.
  optional int64 expected_job_id = 1;
  optional double rpc_timeout_seconds = 2;
}

message WaitForJobModelParams {
  // Absent: wait for the model of the newest job (see after_job_id).
  optional int64 expected_job_id = 1;
  // Ignore jobs up to this id: wait for a job that is newer than it.
  optional int64 after_job_id = 2;
  optional double timeout_seconds = 3;
  optional double poll_interval_seconds = 4;
  optional double rpc_timeout_seconds = 5;
}

message JobModelReadiness {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    // No job with a file has been seen (or none newer than after_job_id).
    NO_JOB = 1;
    DOWNLOADING = 2;
    CONVERTING = 3;
    MODEL_READY = 4;
    MODEL_FAILED = 5;
  }
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    SNAPSHOT = 1;
    READY = 2;
    TIMED_OUT = 3;
  }
  omts.prusalink.ModelStatus model = 1;
  Decision decision = 2;
  Outcome outcome = 3;
  // True only for MODEL_READY. Advisory; this skill never moves a robot.
  bool model_ready = 4;
}
