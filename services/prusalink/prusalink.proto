syntax = "proto3";

package omts.prusalink;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message PrusaLinkConfig {
  string printer_url = 1;
  string username = 2;
  // Credentials are read at startup, never stored in the asset bundle.
  string password_env = 3;
  double timeout_seconds = 4;
  bool enable_job_commands = 5;
}

enum PrinterState {
  PRINTER_STATE_UNSPECIFIED = 0;
  IDLE = 1;
  BUSY = 2;
  PRINTING = 3;
  PAUSED = 4;
  FINISHED = 5;
  STOPPED = 6;
  ERROR = 7;
  ATTENTION = 8;
  READY = 9;
}

message PrinterStatus {
  PrinterState state = 1;
  optional double bed_temperature_c = 2;
  optional double nozzle_temperature_c = 3;
  optional int64 job_id = 4;
  optional double progress_percent = 5;
  bool print_finished = 6;
  // Advisory telemetry, not authorization to move a robot.
  bool ready_for_unload = 7;
  google.protobuf.Timestamp observed_at = 8;
}

message Job {
  bool has_job = 1;
  optional int64 id = 2;
  PrinterState state = 3;
  optional double progress_percent = 4;
  optional int64 time_printing_seconds = 5;
  optional int64 time_remaining_seconds = 6;
}

message JobCommand {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    PAUSE = 1;
    RESUME = 2;
    STOP = 3;
    CONTINUE = 4;
  }
  int64 job_id = 1;
  Action action = 2;
}

service PrusaLinkService {
  rpc GetStatus(google.protobuf.Empty) returns (PrinterStatus);
  rpc GetJob(google.protobuf.Empty) returns (Job);
  rpc CommandJob(JobCommand) returns (google.protobuf.Empty);
}
