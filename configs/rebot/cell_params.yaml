# Run-time parameters of the reBot cell. research/tools:configure_cell turns
# them into a world update and an app_config, with no rebuild, and checks them
# (research/REBOT_OMTS_APP.md). These values match the committed configs.

# The printer model's origin along x from the robot's base (m). The bed's centre
# is 2.95 cm nearer than this. See the tool's limits in research/HANDOFF.md.
printer_distance_m: 0.5895

# The Orbbec camera from the arm's flange (m), in the flange frame: x is the
# gripper's +x side, z along the tool axis. Its orientation stays fixed.
camera_offset_m: [0.07, -0.024, 0.076]

# What is put on the bed: a name from configs/rebot/targets.yaml. Any but the
# default part needs a deploy with --//:test_parts.
target: rebot_printed_part

# The outfeed line (research/HANDOFF.md, section 5e): where finished parts are
# set down, to the robot's right. `layout` picks one of the two below; `count`
# is the number of spots. Spot 0 is the nearest to the printer and each next spot
# is further from it.
#  * line: spots along x at `y`, from `start_x`, `spacing` apart (m, negative
#    steps away from the printer), with the tool leaning along -y, so every part
#    is set down axis aligned.
#  * arc: spots on a circle of `radius` (m) around the robot's base, from
#    `start_bearing`, `step` apart (degrees, negative steps away from the
#    printer), each leaning along its bearing: the same distance from the robot
#    and the same orientation relative to it.
#
# `transit_rotation_degrees` makes the cycle pass through a frame between `view`
# and a spot, both ways: `view` turned by this much about the robot's base, so
# the tool faces the outfeed (-90 for spots to the robot's right). It keeps the
# arm and the held part away from the printer's corner. Leave it out for none.
outfeed:
  layout: line
  count: 5
  transit_rotation_degrees: -90.0
  line:
    y: -0.50
    start_x: 0.30
    spacing: -0.10
  arc:
    radius: 0.50
    start_bearing: -52.0
    step: -12.0
